<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Aturan kategori deadline</title>
  <desc id="desc">Sumbu sisa waktu ke deadline. Sisa kurang dari nol berarti terlambat, nol sampai kurang dari 24 jam berarti mendekati deadline, 24 jam atau lebih berarti normal. Contoh data dokumen studi kasus pada 3 Juli pukul 00.00 WIB.</desc>
  <style>
    .bg { fill: #fafafa; }
    .ink { fill: #18181b; }
    .muted { fill: #71717a; }
    .rule { stroke: #d4d4d8; }
    .axis { stroke: #18181b; }
    .late-band { fill: #fee2e2; }
    .late-ink { fill: #b91c1c; }
    .late-stroke { stroke: #b91c1c; }
    .due-band { fill: #fef3c7; }
    .due-ink { fill: #92400e; }
    .due-stroke { stroke: #d97706; }
    .normal-band { fill: none; stroke: #d4d4d8; stroke-dasharray: 4 4; }
    .solid-dot { fill: #18181b; }
    .open-dot { fill: #fafafa; stroke: #18181b; }
    .sans { font-family: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #09090b; }
      .ink { fill: #f4f4f5; }
      .muted { fill: #a1a1aa; }
      .rule { stroke: #3f3f46; }
      .axis { stroke: #f4f4f5; }
      .late-band { fill: #2a0f0f; }
      .late-ink { fill: #fca5a5; }
      .late-stroke { stroke: #f87171; }
      .due-band { fill: #2a1f0a; }
      .due-ink { fill: #fcd34d; }
      .due-stroke { stroke: #f59e0b; }
      .normal-band { stroke: #3f3f46; }
      .solid-dot { fill: #f4f4f5; }
      .open-dot { fill: #09090b; stroke: #f4f4f5; }
    }
  </style>

  <rect class="bg" width="960" height="520" rx="12"/>

  <text class="ink sans" x="40" y="58" font-size="20" font-weight="600">Kategori dihitung dari sisa waktu</text>
  <text class="muted mono" x="920" y="58" font-size="13" text-anchor="end">sisa = deadline - now</text>
  <line class="rule" x1="40" y1="78" x2="920" y2="78" stroke-width="1.5"/>

  <rect class="late-band" x="80" y="120" width="205" height="84"/>
  <text class="late-ink mono" x="182" y="156" font-size="14" font-weight="600" text-anchor="middle">terlambat</text>
  <text class="late-ink mono" x="182" y="180" font-size="12" text-anchor="middle">sisa &lt; 0</text>

  <rect class="due-band" x="285" y="120" width="205" height="84"/>
  <line class="due-stroke" x1="285" y1="120" x2="490" y2="120" stroke-width="3"/>
  <text class="due-ink mono" x="387" y="156" font-size="14" font-weight="600" text-anchor="middle">mendekati_deadline</text>
  <text class="due-ink mono" x="387" y="180" font-size="12" text-anchor="middle">0 ≤ sisa &lt; 24 jam</text>

  <rect class="normal-band" x="491" y="121" width="408" height="82"/>
  <text class="ink mono" x="695" y="156" font-size="14" font-weight="600" text-anchor="middle">normal</text>
  <text class="muted mono" x="695" y="180" font-size="12" text-anchor="middle">sisa ≥ 24 jam</text>

  <line class="axis" x1="80" y1="204" x2="900" y2="204" stroke-width="1.5"/>
  <g class="muted mono" font-size="12" text-anchor="middle">
    <line class="axis" x1="80" y1="204" x2="80" y2="212"/>
    <text x="80" y="230">-24 j</text>
    <text x="285" y="230">0</text>
    <text x="490" y="230">24 j</text>
    <line class="axis" x1="695" y1="204" x2="695" y2="212"/>
    <text x="695" y="230">48 j</text>
    <line class="axis" x1="900" y1="204" x2="900" y2="212"/>
    <text x="900" y="230">72 j</text>
  </g>
  <circle class="solid-dot" cx="285" cy="204" r="6"/>
  <circle class="open-dot" cx="490" cy="204" r="6" stroke-width="2"/>

  <text class="muted sans" x="285" y="256" font-size="12" text-anchor="middle">tepat di deadline masih</text>
  <text class="muted sans" x="285" y="272" font-size="12" text-anchor="middle">mendekati, belum terlambat</text>
  <text class="muted sans" x="490" y="256" font-size="12" text-anchor="middle">sisa tepat 24 jam</text>
  <text class="muted sans" x="490" y="272" font-size="12" text-anchor="middle">sudah normal</text>

  <line class="rule" x1="40" y1="306" x2="920" y2="306"/>
  <text class="ink sans" x="40" y="338" font-size="14" font-weight="600">Contoh data dokumen studi kasus</text>
  <text class="muted mono" x="920" y="338" font-size="12" text-anchor="end">now = 3 Juli 2026, 00.00 WIB</text>

  <line class="rule" x1="80" y1="364" x2="900" y2="364" stroke-width="1.5"/>
  <line class="rule" x1="285" y1="358" x2="285" y2="370" stroke-width="1.5"/>
  <line class="rule" x1="490" y1="358" x2="490" y2="370" stroke-width="1.5"/>
  <line class="late-stroke" x1="165" y1="364" x2="165" y2="420" stroke-width="2"/>
  <circle class="late-ink" cx="165" cy="364" r="5"/>
  <text class="ink sans" x="177" y="400" font-size="13" font-weight="600">Project 3</text>
  <text class="late-ink mono" x="177" y="418" font-size="12">lewat 14 j</text>

  <line class="due-stroke" x1="486" y1="364" x2="486" y2="420" stroke-width="2"/>
  <circle class="due-ink" cx="486" cy="364" r="5"/>
  <text class="ink sans" x="474" y="400" font-size="13" font-weight="600" text-anchor="end">Lab 4</text>
  <text class="due-ink mono" x="474" y="418" font-size="12" text-anchor="end">sisa 23 j 59 m</text>

  <line class="rule" x1="884" y1="364" x2="884" y2="420" stroke-width="2"/>
  <path class="ink" d="M884 358 L896 364 L884 370 Z"/>
  <text class="ink sans" x="872" y="400" font-size="13" font-weight="600" text-anchor="end">Sprint 2</text>
  <text class="muted mono" x="872" y="418" font-size="12" text-anchor="end">sisa 95 j 59 m</text>

  <line class="rule" x1="40" y1="450" x2="920" y2="450"/>
  <text class="muted sans" x="40" y="478" font-size="13">Tugas berstatus selesai tidak diberi penanda apa pun dan turun ke bagian Selesai.</text>
  <text class="muted sans" x="40" y="500" font-size="13">Urutan daftar: mendekati (terdekat dulu), terlambat (paling baru lewat dulu), normal (terdekat dulu), selesai.</text>
</svg>
