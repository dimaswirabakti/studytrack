name: CI

on:
  push:
    branches: [main]
  pull_request:

# run lama dibatalkan jika ada push baru ke branch yang sama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest

    # database khusus test, runner berjalan dalam utc sehingga bug zona waktu ikut teruji
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studytrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studytrack_test

    steps:
      - uses: actions/checkout@v7

      # versi pnpm dibaca dari field package manager di package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
